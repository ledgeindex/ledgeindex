name: Desktop release

# Tag on the public repo (or after sync): desktop-v0.2.0
# Creates a GitHub Release with installers + latest.yml / latest-mac.yml for electron-updater.
# Keep npm package publishes separate — do not attach @ledgeindex/* npm tags as GitHub Releases.
#
# electron-builder defaults to tag v${version}; our tags are desktop-v*.
# So we package with --publish never, then attach artifacts to $GITHUB_REF_NAME via gh.
#
# Matrix: Windows + macOS. Runtime natives are packed per runner OS.
# Mac: electron-builder signs + notarizes when CSC_LINK / Apple secrets are set.
# Both platforms ship the same build/desktop-server tree (bundled server.cjs plus
# unbundlable natives), copied into Resources by afterPack because extraResources
# FileSets strip node_modules.
#
# Required GitHub Actions secrets (client Firebase config — same names as apps/web/.env.example):
#   NEXT_PUBLIC_FIREBASE_API_KEY
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   NEXT_PUBLIC_FIREBASE_APP_ID
#   NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID          (optional)
#   NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID   (optional)
# Desktop Google OAuth loopback (ActiveHue-style; packaged file:// auth):
#   LEDGEINDEX_GOOGLE_DESKTOP_CLIENT_ID
#   LEDGEINDEX_GOOGLE_DESKTOP_CLIENT_SECRET
#   NEXT_PUBLIC_LEDGEINDEX_REMOTE_API_URL   (hosted API for Public tab, non-localhost — required for release builds)
# Mac code signing + notarization (macos-latest job):
#   CSC_LINK                         (base64 of Developer ID Application .p12)
#   CSC_KEY_PASSWORD                 (.p12 export password)
#   APPLE_ID                         (Apple ID email)
#   APPLE_APP_SPECIFIC_PASSWORD      (appleid.apple.com app-specific password)
#   APPLE_TEAM_ID                    (10-char Team ID)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (no publish)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            electron_builder_args: --win
          - os: macos-latest
            electron_builder_args: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build client
        run: npm run build -w @ledgeindex/client

      - name: Pack desktop-server sidecar
        run: node scripts/pack-desktop-server.mjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build desktop
        run: npm run build -w @ledgeindex/desktop
        env:
          # Injected into renderer define via electron.vite.config.ts (process.env wins over .env files).
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID }}
          LEDGEINDEX_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.LEDGEINDEX_GOOGLE_DESKTOP_CLIENT_ID }}
          LEDGEINDEX_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.LEDGEINDEX_GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_LEDGEINDEX_REMOTE_API_URL: ${{ secrets.NEXT_PUBLIC_LEDGEINDEX_REMOTE_API_URL }}

      - name: Package installer
        working-directory: apps/desktop
        shell: bash
        env:
          # Mac: Developer ID sign + notarize (ignored on Windows).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config electron-builder.yml ${{ matrix.electron_builder_args }} --publish never

      # afterPack is the only thing putting the runtime into the app, so verify
      # it landed. Also guards against the bundle regressing into a full
      # node_modules tree, which is what made signing take over an hour.
      - name: Verify packaged runtime
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            RES="$(echo dist/mac-arm64/*.app)/Contents/Resources"
          else
            RES="dist/win-unpacked/resources"
          fi
          ROOT="$RES/desktop-server"

          # Every production dependency of apps/desktop lands in app.asar. Vite
          # bundles main + renderer, so only what main require()s belongs there
          # (~23 MB). A renderer or workspace package moved back into
          # `dependencies` drags its whole tree in, and past ~2 GB makensis can
          # no longer mmap the payload and the Windows installer stops building.
          ASAR_MB="$(du -m "$RES/app.asar" | cut -f1)"
          echo "app.asar: ${ASAR_MB} MB"
          if [[ "$ASAR_MB" -gt 200 ]]; then
            echo "app.asar grew to ${ASAR_MB} MB — a dependency tree slipped back in."
            exit 1
          fi

          if [[ ! -f "$ROOT/server.cjs" ]]; then
            echo "Missing bundled server at $ROOT/server.cjs"
            ls -la "$ROOT" || true
            exit 1
          fi

          if [[ -d "$ROOT/node_modules/@ledgeindex" ]]; then
            echo "@ledgeindex packages must be bundled, not shipped as modules:"
            ls -la "$ROOT/node_modules/@ledgeindex"
            exit 1
          fi

          FILES="$(find "$ROOT" -type f | wc -l | tr -d ' ')"
          echo "runtime ok: server.cjs present, $FILES files"
          if [[ "$FILES" -gt 20000 ]]; then
            echo "Runtime file count regressed to $FILES — expected a few thousand."
            exit 1
          fi

      - name: Publish GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          echo "Publishing artifacts to existing tag: ${TAG} (version ${VERSION}) on ${{ matrix.os }}"

          shopt -s nullglob
          files=()
          for pattern in \
            dist/LedgeIndex-*-setup.exe \
            dist/LedgeIndex-*-setup.exe.blockmap \
            dist/LedgeIndex-*-mac-*.dmg \
            dist/LedgeIndex-*-mac-*.dmg.blockmap \
            dist/LedgeIndex-*-mac-*.zip \
            dist/LedgeIndex-*-mac-*.zip.blockmap \
            dist/latest.yml \
            dist/latest-mac.yml
          do
            for f in $pattern; do
              # Literal paths (latest.yml / latest-mac.yml) only exist on the
              # matching OS — skip missing files so Windows doesn't upload mac metadata.
              if [[ -f "$f" ]]; then
                files+=("$f")
              fi
            done
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found in dist/"
            ls -la dist || true
            exit 1
          fi
          printf 'Artifacts:\n'
          printf '  %s\n' "${files[@]}"

          # Matrix jobs race on first create — retry upload after a peer creates the release.
          if ! gh release view "$TAG" --repo ledgeindex/ledgeindex >/dev/null 2>&1; then
            NOTES="$(printf '%s\n\n%s\n%s' \
              "LedgeIndex desktop ${VERSION}" \
              'Windows: `LedgeIndex-*-setup.exe`' \
              'macOS: `LedgeIndex-*-mac-*.dmg` (Apple Silicon, signed + notarized).')"
            gh release create "$TAG" \
              --repo ledgeindex/ledgeindex \
              --title "LedgeIndex Desktop ${VERSION}" \
              --notes "$NOTES" \
              --verify-tag \
              || true
          fi

          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo ledgeindex/ledgeindex >/dev/null 2>&1; then
              gh release upload "$TAG" "${files[@]}" \
                --repo ledgeindex/ledgeindex \
                --clobber
              exit 0
            fi
            echo "Release not ready yet (attempt ${attempt}); waiting…"
            sleep 5
          done

          echo "Timed out waiting for GitHub Release ${TAG}"
          exit 1
