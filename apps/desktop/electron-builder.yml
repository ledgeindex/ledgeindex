appId: com.ledgeindex.desktop
productName: LedgeIndex
# Scoped npm name (@ledgeindex/desktop) breaks NSIS paths on Windows (${name} → @ledgeindex\desktop-...).
# Keep artifact names slash-free for makensis + electron-updater.
# Icons live in resources/ (tracked); build/ is gitignored (sidecar stage + local icons).
extraMetadata:
  name: ledgeindex-desktop
directories:
  buildResources: resources
# electron-builder copies every production `dependency` into app.asar. Vite bundles
# the renderer and the main process, so only what main require()s at runtime belongs
# in dependencies — everything else stays a devDependency. Moving a renderer package
# back into dependencies drags its whole tree into the asar (that is how it once grew
# to 4 GB / 45k entries, past the limit where makensis can mmap the payload).
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!build/desktop-server/**'
  # Only the *configured* output dir is auto-excluded, so a local build into an
  # alternate dir would pack the other dist trees (asar + nsis.7z) into the asar.
  - '!dist*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# The desktop server ships as build/desktop-server: one bundled server.cjs plus
# a node_modules holding only what cannot be bundled. All platforms get the same
# tree. extraResources FileSets strip node_modules, so afterPack copies it.
afterPack: ../../scripts/desktop-after-pack.mjs
extraResources:
  # Tray + runtime icons at resources/ root (process.resourcesPath/icon.png).
  # buildResources alone only feeds electron-builder installers — it does not copy these.
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
asarUnpack:
  - 'resources/**'
win:
  executableName: LedgeIndex
  icon: resources/icon.ico
nsis:
  artifactName: LedgeIndex-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Requires GitHub Actions secrets: CSC_LINK, CSC_KEY_PASSWORD,
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  notarize: true
  artifactName: LedgeIndex-${version}-mac-${arch}.${ext}
  # afterPack copies build/desktop-server. Do not add it as extraResources —
  # the FileSet strips node_modules and would ship a stub.
  # No signIgnore needed: @electron/osx-sign detects binaries by content
  # (isBinaryFile) and never passes server.cjs or the packages' JS to codesign.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: LedgeIndex-${version}-mac-${arch}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: ledgeindex.com
  category: Utility
appImage:
  artifactName: LedgeIndex-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: ledgeindex
  repo: ledgeindex
  releaseType: release
